name: bowline CI

on:
  push:
    branches: [ 'main', 'ci', 'ci-uc' ]
  pull_request:
    branches: [ 'main' ]
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

env:
  GITHUB_PR_NUMBER: ${{github.event.pull_request.number}}

# Pushing again to a branch which is still building leaves the earlier run
# holding runners -- macOS slots in particular, where there are only five --
# to produce a result nobody will read.  Not on main: that is where the cache
# is written from, and a run cancelled partway never reaches the save step.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-deb-and-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:  [ 'ubuntu-latest' ]
        debian_rev: [ 'trixie', 'bookworm' ]

    steps:
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled }}
      with:
        detached: true
    - name: env variable
      run: |
        echo "pkg_version=0.0.0."$(date +%Y%m%d)"" >> $GITHUB_ENV
        if [ ${{ github.event_name }} == "pull_request" ] ; then
          echo "head_commit=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
        else
          echo "head_commit=${{ github.sha }}" >> $GITHUB_ENV
        fi
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      id: cache
      with:
        path: |
          cabal-cache
        key: cache-${{ hashFiles('dnsext-bowline/dnsext-bowline.cabal') }}
    - name: inject cache into docker
      uses: reproducible-containers/buildkit-cache-dance@v3.1.0
      with:
        cache-map: |
          {
            "cabal-cache": "/root/.cabal"
          }
        skip-extraction: ${{ steps.cache.outputs.cache-hit }}

    - name: build docker image (and binaries)
      run: |
        mkdir -p linux/pkg/opt/bowline/bin linux/pkg/opt/bowline/etc
        cd build-docker
        DEBIAN_REVISION=${{ matrix.debian_rev }} USE_DOCKER_CACHE=1 ./build.sh -x ${{ env.head_commit }} ${{ github.server_url }}/${{ github.repository }}
        cd ..
        docker run --rm -v /home:/home bowline:${{ matrix.debian_rev }} bash -c \
            "cp /opt/bowline/bin/{bowline,dug,dump} `pwd`/"
    - name: build deb package
      run: |
        mkdir -p pkg/work/bowline-${{ env.pkg_version }}/bin
        docker run --rm -i --name build-bowline \
            -v /home:/home debian:${{ matrix.debian_rev }}-slim \
            bash -x -c \
            "apt-get update ;\
            apt-get install -y devscripts ;\
            cd `pwd`; \
            cd pkg/template; debchange -v ${{ env.pkg_version }} -M 'gh action build'; \
            cd ../work; ln -s ../../../dnsext ./; cd .. ; \
            ./pkgctl.sh data ${{ env.pkg_version }} ;\
            cp ../{bowline,dug,dump} ./work/bowline-${{ env.pkg_version }}/bin/ ;\
            ./pkgctl.sh pkgs ${{ env.pkg_version }} ;\
            "
        PACKAGE_FILENAME=$(cd pkg/work/ && ls -1 *.deb | head -1) ; export PACKAGE_FILENAME
        ARTIFACT_FILENAME=${{ matrix.debian_rev }}.${PACKAGE_FILENAME} ; export ARTIFACT_FILENAME
        set -x
        mv pkg/work/${PACKAGE_FILENAME} ./
        cp -a ${PACKAGE_FILENAME} ${ARTIFACT_FILENAME}
        dpkg --contents ${PACKAGE_FILENAME}
        echo "PACKAGE_FILENAME=${PACKAGE_FILENAME}" >> $GITHUB_ENV
        echo "ARTIFACT_FILENAME=${ARTIFACT_FILENAME}" >> $GITHUB_ENV

    - name: .deb installation
      run: |
        docker run -d --name bowline \
            -p 1853:853/udp -p 1853:853 -p 1443:443/udp -p 1443:443 \
            -p 1053:53/udp -p 1053:53 -p 1080:80 \
            -v /home:/home debian:${{ matrix.debian_rev }}-slim bash -x -c \
            "apt-get update ;\
            apt-get install -y curl `pwd`/${{ env.PACKAGE_FILENAME }} ;\
            echo \"DAEMON_OPTS='dns-addrs=0.0.0.0 log-level=debug h2c=yes'\" >> /etc/default/bowline ; \
            bash -x /etc/init.d/bowline start ; sleep 10000;\
            "
    - name: basic test
      run: |
        sleep 10
        docker ps -a
        set -x
        dig @127.0.0.1 -p 1053 github.com
        dig @127.0.0.1 -p 1853 github.com +tls
        dig @127.0.0.1 -p 1443 github.com +https
        PATH=`pwd`:${PATH} sh -xe ./pkg/proto-checks.sh all non-root

    - name: additional tests
      run: |
        echo "===current pid==="
        docker exec bowline cat /run/bowline.pid
        docker exec bowline /etc/init.d/bowline restart
        echo "===new pid==="
        docker exec bowline cat /run/bowline.pid
        echo "===reload==="
        sleep 3
        docker exec bowline /etc/init.d/bowline reload
        docker exec -i bowline bash -c "cat /opt/bowline/log/bowline.log" | grep "monitor"
        echo "===re-open==="
        sleep 3
        docker exec bowline bash -c "curl --silent http://127.0.0.1:8080/reopen-log"
        docker exec -i bowline bash -c "cat /opt/bowline/log/bowline.log" | grep "re-opening log"
    - name: logs
      if: always()
      run: |
        docker logs bowline
        docker exec -i bowline bash -c "cat /opt/bowline/log/bowline.log"
    - name: upload artifact
      uses: actions/upload-artifact@v4
      with:
        path: ${{ env.PACKAGE_FILENAME }}
        name: ${{ env.ARTIFACT_FILENAME }}
    - name: login to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: push container image
      if: github.event_name != 'pull_request' && github.repository_owner == 'iijlab'
      run: |
        docker tag bowline:${{ matrix.debian_rev }} ghcr.io/${{ github.repository_owner }}/bowline:${{ matrix.debian_rev }}-${{ env.pkg_version }}
        docker tag bowline:${{ matrix.debian_rev }} ghcr.io/${{ github.repository_owner }}/bowline:${{ matrix.debian_rev }}-latest
        docker push ghcr.io/${{ github.repository_owner }}/bowline:${{ matrix.debian_rev }}-${{ env.pkg_version }}
        docker push ghcr.io/${{ github.repository_owner }}/bowline:${{ matrix.debian_rev }}-latest
    - name: Github Releases
      if: gitHub.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ${{ env.ARTIFACT_FILENAME }}
    - name: release to cloudsmith
      if: gitHub.event_name == 'release' && runner.os == 'linux'
      id: push
      uses: cloudsmith-io/action@master
      with:
        api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
        command: "push"
        format: "deb"
        owner: "iijlab"
        repo: "bowline"
        distro: "debian"
        release: "${{ matrix.debian_rev }}"
        republish: "true" # needed ONLY if version is not changing
        file: ${{ env.PACKAGE_FILENAME }}
