name: Haskell CI

on:
  push:
    branches: [ 'main', 'ci', 'ci-uc', 'ci-brew' ]
  pull_request:
    branches: [ 'main' ]
  release:
    types:
      - created
# Pushing again to a branch which is still building leaves the earlier run
# holding runners -- macOS slots in particular, where there are only five --
# to produce a result nobody will read.  Not on main: that is where the cache
# is written from, and a run cancelled partway never reaches the save step.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:  [ 'ubuntu-latest', 'macOS-latest' ]
        ghc: [ '9.2', '9.4', '9.6', '9.8', '9.10', '9.12' ]
        include:
          - os: ubuntu-latest
            arch: amd64
            osname: linux
          - os: macOS-latest
            arch: arm64
            osname: mac

    env:
      cache-name: cabal-ghc
      build-targets: all:libs all:exes all:tests --disable-benchmarks
      ## doctest version constraint, to preserve stable behavior
      ## e.g. avoiding errors on doctest-0.25.0 like "doctest: unrecognized option '--make'"
      install-doctest-param: --ignore-project --overwrite-policy=always --constraint='doctest<0.25'
      repl-doctest-param: --with-compiler=doctest --disable-benchmarks

    steps:
    - run: git config --global core.autocrlf false

    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: latest

    - name: Hackage index, Cache Key
      id: params
      shell: bash
      run: |
        ghc_version=$(ghc --numeric-version)
        cabal v2-update
        echo "cache=${{ runner.os }}-build-${{ env.cache-name }}-${ghc_version}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}" > "$GITHUB_OUTPUT"
        echo "ghc_version=$ghc_version" >> "$GITHUB_OUTPUT"
        echo "release_brew=${{ (github.event_name == 'release' || github.ref_name == 'ci-brew') && runner.os == 'macOS' }}" >> "$GITHUB_OUTPUT"

    - name: Restore Cache
      uses: actions/cache/restore@v4
      if: ${{ github.ref_name != 'ci-uc' }}
      with:
        path: ~/.cabal
        key: ${{ steps.params.outputs.cache }}

    - name: Install doctest
      id: doctest-dep
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        set -x
        if cabal v2-install doctest ${{ env.install-doctest-param }} --offline
        then
          echo "installed=false" >> "$GITHUB_OUTPUT"
        else
          cabal v2-install doctest ${{ env.install-doctest-param }}
          echo "installed=true" >> "$GITHUB_OUTPUT"
        fi
        doctest --version

    - name: Install dependencies
      id: inst-dep
      shell: bash
      run: |
        set -x
        if cabal v2-build ${{ env.build-targets }} --only-dependencies --offline
        then
          echo "installed=false" >> "$GITHUB_OUTPUT"
        else
          cabal v2-build ${{ env.build-targets }} --only-dependencies
          echo "installed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save Cache
      uses: actions/cache/save@v4
      if: ${{ steps.inst-dep.outputs.installed == 'true' || steps.doctest-dep.outputs.installed == 'true' }}
      with:
        path: ~/.cabal
        key: ${{ steps.params.outputs.cache }}

    - name: Build
      run: cabal v2-build ${{ env.build-targets }}

    - name: Run tests
      run: env DISABLE_V6_NS=1 cabal v2-test --test-show-details=streaming all:tests

    - name: Run doctest
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        set -x
        for package in $(cat cabal.project | sed 's/packages://g' | sed 's/dnsext-bowline//g')
        do
          DISABLE_V6_NS=1 cabal v2-repl $package               ${{ env.repl-doctest-param }}
        done
        DISABLE_V6_NS=1   cabal v2-repl dnsext-bowline:bowline ${{ env.repl-doctest-param }}

    - name: Install
      if: matrix.ghc == '9.6'
      run: |
        mkdir dist
        for name in bowline dug ; do
          cp -L $(cabal list-bin ./dnsext-bowline:$name) dist/$name-${{ matrix.osname }}-${{ matrix.arch }}
          strip dist/$name-${{ matrix.osname }}-${{ matrix.arch }}
          ls -l dist/$name-${{ matrix.osname }}-${{ matrix.arch }}
        done
    - name: Upload artifact
      if: matrix.ghc == '9.6'
      uses: actions/upload-artifact@v4
      with:
        path: |
          dist/*
        name: dnsext-bowline-${{ runner.os }}-${{ runner.arch }}
    - name: Github Releases
      if: gitHub.event_name == 'release' && matrix.ghc == '9.6'
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          dist/*
    - name: Homebrew-checksum
      id: checksum
      if: steps.params.outputs.release_brew == 'true' && matrix.ghc == '9.6'
      run: |
        echo "sha256=$(shasum -a 256 dist/dug-mac-arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
    - name: Homebrew-version
      id: version
      if: steps.params.outputs.release_brew == 'true' && matrix.ghc == '9.6'
      run: |
        echo version=${{ github.ref_name }} >> "$GITHUB_OUTPUT"
        echo brew_version=$(date +%Y%m%d) >> "$GITHUB_OUTPUT"
    - name: trigger Homebrew formulae update
      uses: peter-evans/repository-dispatch@v1
      if: steps.params.outputs.release_brew == 'true' && matrix.ghc == '9.6'
      with:
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        repository: iijlab/homebrew-tap
        event-type: update-brew
        client-payload: '{ "url": "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/dug-mac-arm64", "sha256": "${{ steps.checksum.outputs.sha256 }}", "version": "${{ steps.version.outputs.brew_version }}" }'
