# The primary for the zones below the root of the scenario's world.
# {{DIR}} is where this run keeps everything, {{AUTH_ADDR}} is the
# second address on the loopback, and the port is one asked of the
# kernel.
#
# It holds both of the root's children: the one whose name server is
# named somewhere else, and the somewhere else.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
zone: sibling
  source: {{DIR}}/sibling.zone
  signing: yes
