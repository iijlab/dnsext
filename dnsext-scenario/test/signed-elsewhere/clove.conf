# The primary for the zone below the root.  It is signed with its own
# key, and then every RRSIG is made to name another zone as the one
# which signed it.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
  # Only honoured because clove is started with --insecure, which
  # clove.args asks for.  The signatures are over the right data and
  # made with the right key; the signer field says somebody else.
  signer: elsewhere.
