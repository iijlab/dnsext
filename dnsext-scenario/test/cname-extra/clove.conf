# The primary for the zones below the root of the scenario's world.
# {{DIR}} is where this run keeps everything, {{AUTH_ADDR}} is the
# second address on the loopback, and the port is one asked of the
# kernel.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
  # Only honoured because clove is started with --insecure, which
  # clove.args asks for.  The record goes in the answer section, beside
  # the CNAME it appears to be helping with.
  spoof-answer: {{DIR}}/extra.zone
zone: elsewhere
  source: {{DIR}}/elsewhere.zone
  signing: yes
