# The root of the scenario's world, which adds an NS of its own to
# every answer it sends.  The record is not covered by the signature
# over the real NS RRset, so the priming query -- ". NS" with DO -- does
# not verify, while everything else the root signs still does.
udp-addrs: {{ROOT_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{ROOT_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/root/
zone: .
  source: {{DIR}}/root.zone
  signing: yes
  # Only honoured because clove is started with --insecure, which
  # clove.args asks for.
  spoof-answer: {{DIR}}/extra.zone
