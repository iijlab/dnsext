# The primary for the zones below the root of the scenario's world.
# {{DIR}} is where this run keeps everything, {{AUTH_ADDR}} is the
# second address on the loopback, and the port is one asked of the
# kernel.
#
# It holds example., which is delegated to it and which injects, and
# victim., which is not delegated to it by anyone and which the
# injection is for.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
  # Only honoured because clove is started with --insecure, which
  # clove.args asks for.  Every response example. sends carries a
  # delegation for victim. and the glue to go with it, neither of which
  # is example.'s to send.
  spoof-authority: {{DIR}}/inject-authority.zone
  spoof-additional: {{DIR}}/inject-additional.zone
zone: victim
  source: {{DIR}}/victim.zone
  signing: no
