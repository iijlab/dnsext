# The root of the scenario's world, and the primary for the zone
# example. delegates to, so that the delegation leads to a server which
# is somewhere else and answers.
udp-addrs: {{ROOT_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{ROOT_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/root/
zone: .
  source: {{DIR}}/root.zone
  signing: yes
zone: sub.example
  source: {{DIR}}/sub.zone
  signing: no
