# A signed zone which takes the NSEC3 records out of everything it
# sends, so its referral says nothing about whether the child has a DS.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
  # Needs --insecure, which clove.args gives.
  spoof-strip: NSEC3
