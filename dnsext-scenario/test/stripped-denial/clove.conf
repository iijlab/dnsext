# A signed zone which takes the NSEC3 records out of everything it
# sends.  What it delegates it delegates without a DS, and without the
# NSEC3s there is nothing left in the referral to say so: the message
# carries a delegation and no word either way about whether the child is
# signed.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
  # Only honoured because clove is started with --insecure, which
  # clove.args asks for.  This is what is left of a message after
  # somebody who can drop records from it has been through.
  spoof-strip: NSEC3
