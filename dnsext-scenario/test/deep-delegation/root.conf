# The root of the scenario's world, and -- two cuts further down -- the
# grandchild of it.  What is in between, example., is on the other
# server, so clove here holds a zone and its grandchild without holding
# the zone which delegates that grandchild.
#
# That is the arrangement which lets a three-level chain be walked with
# only two servers to walk it on.
udp-addrs: {{ROOT_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{ROOT_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: DEBUG
clove-dir: {{DIR}}/root/
zone: .
  source: {{DIR}}/root.zone
  signing: yes
zone: sub.example
  source: {{DIR}}/sub.example.zone
  signing: yes
