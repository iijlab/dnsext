# The middle of the chain, on the second loopback address.  It is
# delegated to by the root and delegates onward to sub.example., which
# is back on the first address -- so a resolver walking down goes there,
# here, and back again.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: DEBUG
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
