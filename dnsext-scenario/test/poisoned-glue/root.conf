# The root of the scenario's world.  It is a primary like any other, and
# what makes it the root is that bowline is pointed at it by a hint and
# starts from it.  It is signed, and the DS of its key is the trust
# anchor the scenario is validated from.
#
# It lives at {{ROOT_ADDR}}, which every machine has; the zones below it
# are on {{AUTH_ADDR}}, so that a delegation has somewhere else to point
# and bowline has to follow it.  Both are on the port the harness asked
# the kernel for, which bowline is told about by auth-port.
udp-addrs: {{ROOT_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{ROOT_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/root/
zone: .
  source: {{DIR}}/root.zone
  signing: yes
  # Only honoured because clove is started with --insecure, which
  # root.args asks for.  Every response this zone sends carries these
  # records in its additional section, the referrals among them, and a
  # referral's additional section is where a resolver looks for glue.
  spoof-additional: {{DIR}}/poison.zone
