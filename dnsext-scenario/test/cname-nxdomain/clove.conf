# The primary for the zones below the root of the scenario's world.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: DEBUG
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: no
  # Only honoured because clove is started with --insecure, which
  # clove.args asks for.  alias.example. is in the zone and has a CNAME,
  # so the answer it is owed is that CNAME and NOERROR.  Denying it
  # leaves the CNAME in the answer section and puts NXDOMAIN in the
  # header over the top of it, which is the response this is about.
  spoof-nxdomain: alias.example.
zone: elsewhere
  source: {{DIR}}/elsewhere.zone
  signing: no
