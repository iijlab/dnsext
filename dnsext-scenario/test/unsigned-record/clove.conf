# The primary for the zone below the root.  The zone is signed and the
# record attached to every answer is not, which is the whole of the
# scenario.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
  # Only honoured because clove is started with --insecure, which
  # clove.args asks for.  Nothing signs what is put in this way: the
  # zone was signed before it was added.
  spoof-answer: {{DIR}}/unsigned.zone
