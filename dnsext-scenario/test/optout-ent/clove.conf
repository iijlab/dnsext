# The primary for the zone below the root, signed with NSEC3 and with
# Opt-Out asked for -- which is the arrangement this scenario is about
# and not the one a zone should be signed with.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
  nsec3-optout: yes
