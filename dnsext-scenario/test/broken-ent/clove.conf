# The primary for the zones below the root of the scenario's world.
# The harness fills this in: {{DIR}} is where this run keeps everything,
# the scenario's own files among them; {{AUTH_ADDR}} is the second
# address on the loopback, which is what makes this a different server
# from the root and so gives the root's delegations somewhere to point;
# and the port is one asked of the kernel, so that scenarios may run
# beside each other and beside whatever else is on the machine.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: DEBUG
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  # Unsigned, so that a resolver turning the answer down has only the
  # one reason to.
  signing: no
  # Only honoured because clove is started with --insecure, which
  # clove.args asks for.  Both of these names are empty non-terminals
  # and both really are there; NODATA is what they are owed.
  spoof-nxdomain: c.example. b.c.example.
