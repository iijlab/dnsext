# The primary for the scenario's world.  @NAME@ is put in by the
# harness: {{DIR}} is where this run keeps what it writes, {{FILES}} is
# where this scenario's files are read from, and the ports are asked of
# the kernel so that scenarios may run beside each other.
udp-addrs: 127.0.0.1
udp-port: {{PRIMARY_PORT}}
tcp-addrs: 127.0.0.1
tcp-port: {{PRIMARY_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{FILES}}/example.zone
  signing: yes
zone: insecure.example
  source: {{FILES}}/insecure.example.zone
  signing: yes
  # Only honoured because clove is started with --insecure.  This is
  # what makes the child's signatures unverifiable, and what the parent
  # not carrying a DS makes nobody's business.
  signer: sharp.
