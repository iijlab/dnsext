# The resolver for the scenario's world.  It is given a hint naming the
# scenario's own root and a trust anchor made from that root's key, and
# auth-port tells it which port to ask authoritative servers on -- one
# the harness asked the kernel for, so that nothing here needs the
# privilege a well-known port does.  From there it walks down to the
# zone in question as it would on the Internet, through the delegations
# the scenario wrote rather than past them.
log-level: WARNING
dns-addrs: {{ROOT_ADDR}}
udp-port: {{RESOLVER_PORT}}
tcp-port: {{RESOLVER_PORT}}
udp: yes
tcp: yes
tls: no
quic: no
h2: no
h2c: no
h3: no
webapi: no
monitor-addrs: {{ROOT_ADDR}}
monitor-port: {{MONITOR_PORT}}
auth-port: {{AUTH_PORT}}
root-hints: {{DIR}}/root.hints
trust-anchor-file: {{DIR}}/anchor.zone
