# The root of the scenario's world, delegating the zone below it and
# vouching for it with a DS.
udp-addrs: {{ROOT_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{ROOT_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/root/
zone: .
  source: {{DIR}}/root.zone
  signing: yes
