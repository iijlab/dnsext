# A signed zone which leaves every NSEC3 out of what it sends.  Its own
# data is signed as it always was: what is missing is the records which
# say what is *not* there, and the record which says an answer came from
# a wildcard rather than from a name of its own.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
  # Only honoured because clove is started with --insecure, which
  # clove.args asks for.
  spoof-strip: NSEC3

# The same zone again without the setting, so that a wildcard answer
# which does arrive with the record proving nothing closer exists is
# here to be told apart from one which does not.
zone: intact
  source: {{DIR}}/intact.zone
  signing: yes
