# A signed zone which leaves every NSEC3 out of what it sends.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
  # Needs --insecure, which clove.args gives.
  spoof-strip: NSEC3

# The same zone without spoof-strip.
zone: intact
  source: {{DIR}}/intact.zone
  signing: yes
