# The resolver for the scenario's world.  It reaches the primary through
# a stub zone rather than by walking down from the root, so that no
# privileged port and no fake root are needed, and it is given a trust
# anchor for example. so that there is something for it to validate
# from.
log-level: WARNING
dns-addrs: 127.0.0.1
udp-port: {{RESOLVER_PORT}}
tcp-port: {{RESOLVER_PORT}}
udp: yes
tcp: yes
tls: no
quic: no
h2: no
h2c: no
h3: no
webapi: no
monitor-addrs: 127.0.0.1
monitor-port: {{MONITOR_PORT}}
trust-anchor-file: {{DIR}}/anchor.zone
stub-zone: example.
stub-addr: 127.0.0.1@{{PRIMARY_PORT}}
