# The primary for the zone below the root.  The zone is signed with an
# ED25519 key; what is attached to every answer is a pair of signatures
# naming algorithm 8, which no key here is.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
  # Only honoured because clove is started with --insecure, which
  # clove.args asks for.  Nothing here is signed by the zone: the zone
  # was signed before it was added, and these signatures were written
  # by hand.
  spoof-answer: {{DIR}}/forged.zone
