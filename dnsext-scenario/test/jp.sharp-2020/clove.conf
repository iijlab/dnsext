# The primary, holding example. and a fake root which answers for insecure.
# example. comes first, being what the harness waits for; clove.args gives
# --insecure, as the fake root holds example. without delegating it.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
zone: .
  source: {{DIR}}/fake-root.zone
  signing: yes
