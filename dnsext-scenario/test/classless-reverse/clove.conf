# Everything from arpa. down to the /24 whose addresses are being split
# up, in one zone on the second loopback address.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: DEBUG
clove-dir: {{DIR}}/clove/
zone: arpa
  source: {{DIR}}/arpa.zone
  signing: yes
