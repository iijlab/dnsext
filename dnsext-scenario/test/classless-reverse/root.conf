# The root of the scenario's world, and -- two cuts further down -- the
# classless piece of the reverse zone which has been handed to whoever
# holds those addresses.  What is in between, the /24, is on the other
# server, so a resolver walking down goes there, across, and back.
udp-addrs: {{ROOT_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{ROOT_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: DEBUG
clove-dir: {{DIR}}/root/
zone: .
  source: {{DIR}}/root.zone
  signing: yes
zone: 0-63.6.42.150.in-addr.arpa
  source: {{DIR}}/classless.zone
  signing: no
