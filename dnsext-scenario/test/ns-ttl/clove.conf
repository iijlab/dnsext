# The primary for the zone below the root of the scenario's world.  It
# logs at DEBUG so that the scenario can count how often it was asked,
# which is the whole of what this scenario looks at.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: DEBUG
clove-dir: {{DIR}}/clove/
zone: parentlong
  source: {{DIR}}/parentlong.zone
  signing: no
zone: parentbrief
  source: {{DIR}}/parentbrief.zone
  signing: no
