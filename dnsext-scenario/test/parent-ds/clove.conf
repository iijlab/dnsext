# The signed zone in the middle: the root vouches for it with a DS, and
# it delegates two children of its own, neither of which it vouches for.
udp-addrs: {{AUTH_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{AUTH_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/clove/
zone: example
  source: {{DIR}}/example.zone
  signing: yes
