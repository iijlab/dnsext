# The root of the scenario's world, and -- so that a delegation below it
# can lead to a server which is somewhere else -- the primary for one of
# the zones example. delegates to.
udp-addrs: {{ROOT_ADDR}}
udp-port: {{AUTH_PORT}}
tcp-addrs: {{ROOT_ADDR}}
tcp-port: {{AUTH_PORT}}
log: yes
log-level: WARNING
clove-dir: {{DIR}}/root/
zone: .
  source: {{DIR}}/root.zone
  signing: yes
zone: up.example
  source: {{DIR}}/up.zone
  signing: no
