# Addresses to listen on, comma separated.  An address serves its own
# family and no other, so serving both means naming both:
#   tcp-addrs: 0.0.0.0,::
tcp-addrs: ::1
tcp-port: 53
udp-addrs: ::1
udp-port: 53
log: yes
#log-file:
clove-dir: /var/clove/
# Secrets shared with peers, relative to clove-dir unless absolute, and
# readable by nobody else.  Absent means no TSIG.  See tsig.conf beside
# this file for what goes in it.
tsig-file: tsig.conf
log-level: WARNING
# How long a TCP connection may say nothing before it is closed, in
# seconds.  Receiving a message and sending one both put it off, so this
# is idle time and not the age of the connection.  RFC 7766 Sec 6.2.3
# asks for "on the order of seconds" and for enough of them that a
# client can ask its question and read the answer without hurrying.
tcp-client-timeout: 30
# How many TCP connections clove will hold at once, counted across every
# address it listens on.  One over the count is closed as soon as it is
# accepted.
tcp-clients: 150
# How many zone transfers may be going out at once.  One over the count
# is answered SERVFAIL, which tells the secondary to come back rather
# than that it may not have the zone.
transfers-out: 10
# Longest a single outgoing zone transfer may take, in seconds.  While a
# zone is going out the connection's idle timeout does not apply -- a
# write which is blocked because the peer reads slowly cannot report
# progress -- so this is what stops a peer which asks for a zone and
# then never reads it from holding the connection for ever.  An hour is
# enough for a zone of a few megabytes over a very poor link.
transfer-time-limit: 3600
zone: example.jp
  notify: yes
  notify-addrs: 127.0.0.1
  notify-port: 53
  # Name of a key in tsig-file, to sign the notifies we send.
  #notify-key: ns1-ns2.example.jp.
  allow-notify: no
  allow-notify-addrs:
  # Name of a key in tsig-file.  When set, a notify is accepted by
  # carrying the key and allow-notify-addrs is not consulted.
  #allow-notify-key: ns1-ns2.example.jp.
  allow-transfer: yes
  allow-transfer-addrs: ::1
  # Name of a key in tsig-file.  When set, a transfer is granted by
  # holding the key and allow-transfer-addrs is not consulted.
  #allow-transfer-key: ns1-ns2.example.jp.
  # source: should be file or IPv4 or IPv6
  source: zone/example.zone
  # Port of the upstream primary. Used only when source is an address.
  source-port: 53
  # Name of a key in tsig-file, to sign what we ask the upstream with.
  #source-key: ns1-ns2.example.jp.
  # DNSSEC signing is possible regardless of the source type.
  signing: yes
  nsec3: yes
  # ksk-algo and zsk-algo must name the same algorithm: clove signs each
  # RRset with one of the two keys, so two algorithms would leave every
  # RRset signed with only one of them (RFC 4035 Sec 2.2).
  ksk-algo: ED25519
  # Used only for RSA, in bits: 1024 to 4096, a multiple of 8
  ksk-size: 0
  zsk-algo: ED25519
  # Used only for RSA, in bits: 1024 to 4096, a multiple of 8
  zsk-size: 0
  ds-digest: SHA-256
  nsec3-hash: SHA-1
  # Leaving the delegations which carry no DS out of the chain.  RFC 9276
  # Sec 3.2 asks most zones not to; a zone which is mostly delegations is
  # the one it is for.
  nsec3-optout: no
  rrsig-lifetime: 864000
  zsk-rollover-duration: 604800
  zsk-preserve: 10
