tcp-addrs: ::1
tcp-port: 53
udp-addrs: ::1
udp-port: 53
log: yes
#log-file:
clove-dir: /var/clove/
log-devel: WARNING
zone: example.jp
  notify: yes
  notify-addrs: 127.0.0.1
  allow-notify: no
  allow-notify-addrs:
  allow-transfer: yes
  allow-transfer-addrs: ::1
  # source: should be file or IPv4 or IPv6
  source: zone/example.zone
  # DNSSEC signing is possible regardless of the source type.
  siging: yes
  nsec3: yes
  pub-algo: ED25519
  ds-digest: SHA-256
  nsec3-hash: SHA-1
