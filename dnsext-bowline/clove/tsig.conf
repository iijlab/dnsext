# Secrets clove shares with its peers, for signing messages with a TSIG
# (RFC 8945).  clove.conf names this file in "tsig-file", which is
# looked for under clove-dir unless it is given an absolute path.  With
# no such file clove holds no keys, and every setting below which names
# one stops it at startup; that is the whole of what happens when TSIG
# is not wanted.
#
# THE SECRETS IN HERE ARE EXAMPLES AND ARE PUBLIC.  Every one of them
# has to be replaced before the file is of any use, and the copy which
# is used wants the mode it deserves:
#
#     install -m 600 tsig.conf /var/clove/tsig.conf
#
# A file which group or other can read is a warning at startup: a secret
# the rest of the machine can read is nobody's secret.  A new one is a
# run of random octets written base64, as long as the MAC of the
# algorithm it is for -- RFC 8945 Sec 8 will not have it shorter:
#
#     openssl rand -base64 32                           # for hmac-sha256
#     tsig-keygen -a hmac-sha256 ns1-ns2.example.jp.    # if BIND is at hand
#
# The file holds keys and nothing else: no setting may come before the
# first "key:".

# The name of a key is a domain name, and both ends have to call the key
# by the same one.  It says nothing about which zones the key is for.
key: ns1-ns2.example.jp.
  # One of hmac-sha1, hmac-sha224, hmac-sha256, hmac-sha384 and
  # hmac-sha512, and hmac-sha256 when it is not given.  hmac-md5 is not
  # among them: RFC 8945 Sec 6 says it MUST NOT be used.
  algorithm: hmac-sha256
  # Base64, which is how every implementation writes a secret down.
  secret: "ZXhhbXBsZS1rZXktbm90LXNlY3JldC1yZXBsYWNlISE="

# As many keys as there are peers to talk to.  A key shared with
# everybody tells everybody apart from nobody.
key: ns1-ns3.example.jp.
  algorithm: hmac-sha512
  secret: "ZXhhbXBsZS1rZXktbm90LXNlY3JldC1yZXBsYWNlLXRoaXMtb25lLXRvby1iZWZvcmUtaXQtaXMtb2YtYW55LQ=="

# Each zone in clove.conf names the keys it uses, by the names above:
#
#   allow-transfer-key  a transfer is granted by holding this key, and
#                       allow-transfer-addrs is then not consulted
#   source-key          signs what we ask our upstream for -- both the
#                       transfer and the question about the serial --
#                       and nothing it answers is taken without it
#   notify-key          signs the notifies we send
#   allow-notify-key    a notify is acted on only when it carries this
#                       key, and allow-notify-addrs is then not
#                       consulted
#
# A name which is not in this file stops clove at startup, rather than
# leaving a zone quietly running without the TSIG somebody asked for.
#
# Whichever of them is set, a message which arrives signed with any key
# in this file is answered signed with that same key, which RFC 8945
# Sec 5.3 asks of us; and one whose TSIG does not check out is answered
# NOTAUTH with a TSIG saying which check it failed (Sec 5.2).
